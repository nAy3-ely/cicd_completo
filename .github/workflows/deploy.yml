name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions: 
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🧪 Run tests (si no tienes tests, no fallará)
      run: |
        if [ -d tests ]; then pytest; else echo "No tests folder, skipping"; fi

    - name: 🧹 Run lint (opcional, no rompe el pipeline si no existe)
      run: |
        if command -v flake8 >/dev/null 2>&1; then flake8 .; else echo "flake8 no instalado"; fi

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/nay3-ely/cicd_completo:latest

    - name: 🧾 Mostrar variables básicas (solo locales, no secretos)
      run: |
        echo "Probando conexión SSH con:"
        echo Host: ${{ secrets.VPS_HOST }}
        echo Usuario: ${{ secrets.VPS_USER }}
        echo Puerto: ${{ secrets.VPS_SSH_PORT }}
        echo Password: ${{ secrets.VPS_PASSWORD }}
    - name: 🧪 Probar conexión SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "✅ Conexión exitosa desde GitHub Actions"
          hostname
          whoami
          uptime